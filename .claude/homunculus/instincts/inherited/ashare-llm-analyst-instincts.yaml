# Ashare Llm Analyst Workflow Feature Development With Hardened Provider And Shared Logic

## Action

Follow the feature-development-with-hardened-provider-and-shared-logic workflow:
1. Refactor core logic (e.g., anti-crawler, retry manager) into a reusable module (e.g., src/core/anti_crawler.py)
2. Update provider implementation to use shared logic and add new features (e.g., rate limiting, retry, caching, shared login) in src/data/providers.py
3. Update or extend core utilities as needed (e.g., src/core/cache.py, src/core/exceptions.py)
4. Write or update comprehensive tests for the provider, including offline and edge case coverage (e.g., tests/test_providers_harden.py, tests/test_providers.py)
5. Register new or updated tests in the test runner (e.g., tests/run_tests.py)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~1x per month
- Files: src/core/anti_crawler.py, src/data/downloaders.py, src/data/providers.py

